<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Details</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav style="display:block">My Website</nav>

<div style="max-width:900px; margin:100px auto; padding:20px;">

    <div class="back" onclick="backToProjects()">← Back to Projects</div>

    <div class="card">
        <h2 id="projectTitle"></h2>
        <p id="projectDesc"></p>
        <p><span id="projectUpdates"></span></p>
    </div>

</div>

<script>
const projects = {
    portfolio: {
        title: "Store Inventory",
        desc: `In progress`,
        updates: "In progress"
    }
};

// read URL parameter
const params = new URLSearchParams(window.location.search);
const projectKey = params.get("project");

// load project
if (projects[projectKey]) {
    document.getElementById("projectTitle").innerText =
        projects[projectKey].title;
    document.getElementById("projectDesc").innerText =
        projects[projectKey].desc;
    document.getElementById("projectUpdates").innerText =
        projects[projectKey].updates;
}

function backToProjects() {
    window.location.href = "project.html";
}
</script>

</body>
</html>
